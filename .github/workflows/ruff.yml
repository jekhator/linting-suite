name: Ruff

# Ruff lint + format check. Pinned to 0.15.14 to match local version.
# Format drift was previously undetected; this gate prevents future drift.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ruff:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - name: Ruff lint
        run: uvx ruff@0.15.14 check linting_suite/checkers/ linting_suite/config/ linting_suite/inspection/ linting_suite/linter/ linting_suite/loc_cap/ linting_suite/rules/ linting_suite/module/
      - name: Ruff format check
        run: uvx ruff@0.15.14 format --check linting_suite/module/
