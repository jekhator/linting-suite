name: Ruff

# Ruff lint only (trailing whitespace, unused imports, import order). Pinned to 0.15.14 to match local version.
# The format check is off: the layout is written by hand and ruff format is never run.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ruff:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - name: Ruff lint
        run: uvx ruff@0.15.14 check linting_suite/checkers/ linting_suite/config/ linting_suite/inspection/ linting_suite/linter/ linting_suite/loc_cap/ linting_suite/rules/ linting_suite/module/
