[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "linting-suite"
dynamic = ["version"]
description = "Consolidated Python linter with R001-R015 rules for DTO discipline, module structure, typing compliance, constants enforcement, and formatting standards."
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "James Ekhator" }]
requires-python = ">=3.12"
dependencies = []
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
keywords = ["linter", "ast", "dto", "dataclass", "code-quality", "static-analysis", "strict"]

[project.urls]
Homepage = "https://pypi.org/project/linting-suite/"
Repository = "https://github.com/jekhator/linting-suite"
Issues = "https://github.com/jekhator/linting-suite/issues"
Changelog = "https://github.com/jekhator/linting-suite/blob/main/CHANGELOG.md"

[project.scripts]
strict-module = "linting_suite.module.cli:main"
dto-strict = "linting_suite.module.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov", "mypy"]

[tool.hatch.build.targets.wheel]
packages = ["linting_suite"]
exclude = [
    "**/tests",
    "**/fixtures",
]

[tool.hatch.version]
path = "linting_suite/config/_version.py"

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["linting_suite/checkers/tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["linting_suite"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = ["linting_suite/checkers/tests/fixtures/bad/"]

[tool.ruff.format]
exclude = [
    "linting_suite/checkers/r012.py",
    "linting_suite/checkers/r013.py",
    "linting_suite/checkers/r014.py",
    "linting_suite/checkers/tests/test_r012_r013_r014_r015.py",
]

[tool.ruff.lint]
extend-select = ["I", "TID252", "PLC0414", "UP035"]

[tool.ruff.lint.isort]
combine-as-imports = true
known-first-party = ["linting_suite"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.strict-module]
paths = ["linting_suite/checkers/", "linting_suite/config/", "linting_suite/inspection/", "linting_suite/linter/", "linting_suite/loc_cap/", "linting_suite/rules/", "linting_suite/module/"]
service_paths = ["apps/*/services/*.py", "**/services/*.py"]
dto_paths = ["**/dtos.py", "**/dtos/*.py"]
exception_tags = [
    "facade - celery schedule",
    "FRAMEWORK"
]
disabled_rules = []
severity_overrides = {}
# Note: linting_suite/checkers/tests/fixtures/bad/*.py intentionally contain violations
# for use as test corpus. These files are not linted by CI; see setup.cfg.

[tool.strict-module.loc-cap]
hard_cap = 300
soft_target = 200

[tool.pyright]
venvPath = "."
venv = ".venv"
